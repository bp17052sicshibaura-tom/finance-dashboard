<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard | ローン実績</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8;
            --accent-credit: #38bdf8; --accent-loan: #fb923c; --accent-repay: #4ade80; --accent-modify: #a78bfa; --border-color: #334155;
            --sidebar-width: 260px; --grid-gap: 24px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; overflow-x: hidden; }
        
        /* 共通サイドバー */
        .menu-toggle { position: fixed; top: 20px; left: 20px; z-index: 1000; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar { position: fixed; top: 0; left: calc(-1 * var(--sidebar-width)); width: var(--sidebar-width); height: 100vh; background: #090d16; border-right: 1px solid var(--border-color); z-index: 999; padding: 80px 16px 20px 16px; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar.open { left: 0; }
        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; color: var(--text-sub); padding: 14px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; text-decoration: none; transition: all 0.2s; }
        .nav-item:hover { color: var(--text-main); background: var(--bg-card); }
        .nav-item.active { background: var(--bg-card); color: var(--text-main); border-left: 4px solid var(--accent-loan); }

        .main-wrapper { flex: 1; width: 100%; padding: 40px 20px; margin-left: 0; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (min-width: 1024px) { body.sidebar-open .main-wrapper { margin-left: var(--sidebar-width); } }
        .container { max-width: 1200px; margin: 0 auto; padding-top: 40px; }
        header { margin-bottom: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 700; }
        h1 span { color: var(--text-sub); font-size: 14px; display: block; margin-top: 4px; font-weight: 400; }

        /* フォーム & メーター */
        .section-box { background: var(--bg-card); border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); margin-bottom: 32px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; }
        .form-control { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 16px; border-radius: 8px; font-size: 14px; outline: none; width: 100%; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto; gap: 16px; align-items: flex-end; margin-top: 16px; }
        @media (max-width: 768px) { .input-grid { grid-template-columns: 1fr; } }
        .submit-btn { background: linear-gradient(135deg, var(--accent-loan) 0%, #f97316 100%); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; height: 46px; }
        
        .loan-summary-grid { display: grid; grid-template-columns: 2fr 1fr; gap: var(--grid-gap); margin-bottom: 32px; }
        @media (max-width: 900px) { .loan-summary-grid { grid-template-columns: 1fr; } }
        .progress-block { display: flex; flex-direction: column; gap: 16px; }
        .progress-info { display: flex; justify-content: space-between; align-items: flex-end; }
        .progress-numbers { font-size: 24px; font-weight: 700; }
        .progress-numbers span { font-size: 14px; color: var(--text-sub); font-weight: 400; }
        .meter-container { background: #334155; border-radius: 6px; height: 12px; overflow: hidden; }
        .meter-bar { height: 100%; background: linear-gradient(90deg, var(--accent-loan) 0%, #ef4444 100%); width: 0%; transition: width 0.5s; }
        
        .loan-meta-flex { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 16px; }
        .loan-meta-item { text-align: center; flex: 1; }
        .loan-meta-item:not(:last-child) { border-right: 1px solid var(--border-color); }
        .alert-box { display: flex; flex-direction: column; justify-content: center; gap: 10px; background: linear-gradient(135deg, #2e1605 0%, #1e293b 100%); border: 1px solid #7c2d12; }
        
        .loan-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .loan-table th, .loan-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .amount-col { text-align: right; font-weight: 600; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .badge-repay { background: rgba(74, 222, 128, 0.12); color: var(--accent-repay); }
        .badge-borrow { background: rgba(251, 146, 60, 0.12); color: var(--accent-loan); }
        .badge-modify { background: rgba(167, 139, 250, 0.12); color: var(--accent-modify); }
        .item-container { display: flex; align-items: center; }
        .icon-box { width: 32px; height: 32px; border-radius: 8px; background: var(--bg-main); display: inline-flex; align-items: center; justify-content: center; margin-right: 12px; }
    </style>
</head>
<body class="sidebar-open">

    <button class="menu-toggle" id="menu-btn"><i class="fa-solid fa-bars"></i></button>

    <div class="sidebar" id="sidebar">
        <ul class="nav-list">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-chart-pie" style="color: var(--accent-credit);"></i>実績管理ダッシュボード</a>
            <a href="loan-history.html" class="nav-item active"><i class="fa-solid fa-clock-rotate-left" style="color: var(--accent-loan);"></i>カードローン実績・同期</a>
            <a href="simulation.html" class="nav-item"><i class="fa-solid fa-chart-line" style="color: var(--accent-repay);"></i>将来の返済計画</a>
            <a href="credit-card.html" class="nav-item"><i class="fa-solid fa-credit-card" style="color: var(--accent-credit);"></i>クレカ明細 (Mastercard)</a>
        </ul>
        <div style="font-size: 11px; color: var(--text-sub); text-align: center;">Finance Dashboard v3.0</div>
    </div>

    <div class="main-wrapper">
        <div class="container">
            <header>
                <h1>Loan Management <span>カードローン利用実績・手動残高同期</span></h1>
            </header>

            <div class="input-section section-box">
                <div style="font-size: 15px; font-weight: 600;"><i class="fa-solid fa-pen-to-square" style="color: var(--accent-loan);"></i> 実績の登録・残高の修正</div>
                <div class="input-grid">
                    <div class="filter-group"><label for="repay-date">反映・修正日</label><input type="date" id="repay-date" class="form-control"></div>
                    <div class="filter-group"><label id="amount-label" for="repay-amount">返済額 (円)</label><input type="number" id="repay-amount" class="form-control" placeholder="例: 65000"></div>
                    <div class="filter-group">
                        <label for="repay-type">取引・修正種別</label>
                        <select id="repay-type" class="form-control">
                            <option value="定例返済">定例返済（口座引落）</option>
                            <option value="繰上返済">繰上返済（ATM・ネット）</option>
                            <option value="お借入">お借入（残高増）</option>
                            <option value="残高直接修正">★現在の借入残高を直接上書き修正</option>
                        </select>
                    </div>
                    <button class="submit-btn"><i class="fa-solid fa-plus"></i> 履歴へ反映する</button>
                </div>
            </div>

            <div class="loan-summary-grid">
                <div class="section-box progress-block">
                    <div class="progress-info">
                        <div id="calc-loan-rate">現在の借入状況（借入率: --%）</div>
                        <div class="progress-numbers" id="calc-current-balance">¥0 <span>/ 総借入枠 ¥4,500,000</span></div>
                    </div>
                    <div class="meter-container"><div class="meter-bar" id="calc-meter-bar"></div></div>
                    <div class="loan-meta-flex">
                        <div class="loan-meta-item"><div style="font-size:12px;color:var(--text-sub)">適用金利</div><div style="font-weight:600;color:var(--accent-credit)">4.525 %</div></div>
                        <div class="loan-meta-item"><div style="font-size:12px;color:var(--text-sub)">返済可能残り枠</div><div id="calc-remained-limit" style="font-weight:600;color:var(--accent-repay)">¥4,500,000</div></div>
                        <div class="loan-meta-item"><div style="font-size:12px;color:var(--text-sub)">これまでの総返済額</div><div id="calc-total-repaid" style="font-weight:600">¥0</div></div>
                    </div>
                </div>
                <div class="section-box alert-box">
                    <div style="font-size: 11px; color: var(--accent-loan); font-weight:600;">Next Repayment</div>
                    <div id="calc-next-date" style="font-size:22px; font-weight:700;">計算中...</div>
                    <div style="font-size:16px; font-weight:600; color:var(--accent-repay);">¥65,000 <span style="font-size:12px; color:var(--text-sub); font-weight:400;">口座引落</span></div>
                </div>
            </div>

            <div class="section-box">
                <table class="loan-table" id="history-table">
                    <thead>
                        <tr><th>日付</th><th>種別</th><th>取引内容</th><th style="text-align:right;">変動金額</th><th style="text-align:right;">取引後残高</th></tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="5" style="text-align:center; color:var(--text-sub); padding:40px 0;">データを読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyX1eLqAdfVihQppHz-_UZuSTjW1RsLqVpbpf8_Ua9fnZeWelY4ztPki52JkWv3tH3k/exec";
        const TOTAL_LIMIT = 4500000;

        // サイドバー制御
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        if(document.body.classList.contains('sidebar-open')) sidebar.classList.add('open');
        menuBtn.addEventListener('click', () => { sidebar.classList.toggle('open'); document.body.classList.toggle('sidebar-open'); });

        document.getElementById('repay-date').value = new Date().toISOString().split('T')[0];

        // フォームプレースホルダー切り替え
        document.getElementById('repay-type').addEventListener('change', (e) => {
            const label = document.getElementById('amount-label');
            const input = document.getElementById('repay-amount');
            if (e.target.value === '残高直接修正') { label.innerText = "修正後の実際の借入残高 (円)"; input.placeholder = "例: 325450"; }
            else if (e.target.value === 'お借入') { label.innerText = "借入額 (円)"; input.placeholder = "例: 50000"; }
            else { label.innerText = "返済額 (円)"; input.placeholder = "例: 65000"; }
        });

        // 営業日・次回引落日計算
        const holidays2026 = ["2026/01/01", "2026/01/02", "2026/01/03", "2026/01/12", "2026/02/11", "2026/02/23", "2026/02/24", "2026/03/20", "2026/04/29", "2026/05/03", "2026/05/04", "2026/05/05", "2026/05/06", "2026/07/20", "2026/08/11", "2026/09/21", "2026/09/22", "2026/09/23", "2026/10/12", "2026/11/03", "2026/11/23", "2026/12/23"];
        function getNextBusinessDay(date) {
            let d = new Date(date);
            while (true) {
                const dayOfWeek = d.getDay();
                const formattedStr = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
                if (dayOfWeek === 0 || dayOfWeek === 6 || holidays2026.includes(formattedStr)) { d.setDate(d.getDate() + 1); } else { break; }
            }
            return d;
        }
        function calculateNextRepaymentDate() {
            const now = new Date(); let targetYear = now.getFullYear(), targetMonth = now.getMonth();
            let checkDate = getNextBusinessDay(new Date(targetYear, targetMonth, 8));
            if (now > checkDate) { targetMonth += 1; }
            let repaymentDate = getNextBusinessDay(new Date(targetYear, targetMonth, 8));
            return `${repaymentDate.getMonth() + 1}月${repaymentDate.getDate()}日 (${['日', '月', '火', '水', '木', '金', '土'][repaymentDate.getDay()]})`;
        }

        // 初期データ取得
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('calc-next-date').innerText = calculateNextRepaymentDate();
            if (!GAS_URL || GAS_URL.includes('XXXXX')) return;

            fetch(GAS_URL).then(res => res.json()).then(data => {
                const tbody = document.querySelector('#history-table tbody');
                tbody.innerHTML = '';
                if(data.length === 0) return;

                const currentBalance = Number(data[0].balance);
                let totalRepaid = 0;
                data.forEach(item => { if (item.type.includes('返済')) totalRepaid += Math.abs(Number(item.amount)); });

                // UI更新
                const loanRate = Math.round((currentBalance / TOTAL_LIMIT) * 100);
                document.getElementById('calc-loan-rate').innerText = `現在の借入状況（借入率: ${loanRate}%）`;
                document.getElementById('calc-current-balance').innerHTML = `¥${currentBalance.toLocaleString()} <span>/ 総借入枠 ¥${TOTAL_LIMIT.toLocaleString()}</span>`;
                document.getElementById('calc-remained-limit').innerText = `¥${(TOTAL_LIMIT - currentBalance).toLocaleString()}`;
                document.getElementById('calc-total-repaid').innerText = `¥${totalRepaid.toLocaleString()}`;
                document.getElementById('calc-meter-bar').style.width = `${loanRate}%`;

                // テーブル描画
                data.forEach(item => {
                    const isRepay = item.type.includes('返済');
                    const isModify = item.type.includes('修正');
                    let amtColor = 'var(--accent-loan)', badgeClass = 'badge-borrow', icon = 'fa-wallet', amtSign = Number(item.amount) > 0 ? '+' : '';
                    if (isRepay) { amtColor = 'var(--accent-repay)'; badgeClass = 'badge-repay'; icon = 'fa-arrow-up-from-bracket'; }
                    else if (isModify) { amtColor = 'var(--accent-modify)'; badgeClass = 'badge-modify'; icon = 'fa-sliders'; }

                    tbody.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td>${item.date}</td>
                            <td><span class="badge ${badgeClass}">${item.type}</span></td>
                            <td><div class="item-container"><div class="icon-box" style="color: ${amtColor};"><i class="fa-solid ${icon}"></i></div><span>${item.content}</span></div></td>
                            <td class="amount-col" style="color: ${amtColor};">${amtSign}${Number(item.amount).toLocaleString()}円</td>
                            <td class="amount-col">${Number(item.balance).toLocaleString()}円</td>
                        </tr>
                    `);
                });
            });
        });

        // 送信処理
        document.querySelector('.submit-btn').addEventListener('click', () => {
            const dateEl = document.getElementById('repay-date'), amountEl = document.getElementById('repay-amount'), typeEl = document.getElementById('repay-type');
            if (!amountEl || amountEl.value === "") { alert('金額を入力してください'); return; }
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ date: dateEl.value, amount: amountEl.value, type: typeEl.value }) })
                .then(res => res.json()).then(result => { if (result.status === 'success') { alert('反映しました！'); location.reload(); } });
        });
    </script>
</body>
</html>
